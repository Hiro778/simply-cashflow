name: CI & Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test -- --coverage

  build-android-apk:
    name: Build Standalone Android APK
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Package Dist Artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/simply-cashflow.apk
            echo "APK copied successfully: $(ls -lh dist/simply-cashflow.apk)"
          else
            echo "Error: Release APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simply-cashflow-apk
          path: dist/simply-cashflow.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Simply Cashflow v1.0.0
          body: |
            # Simply Cashflow v1.0.0 — Financial OS for Android
            
            Autonomous financial management application built with React Native, Expo, and SQLite.
            
            ### ✨ Highlights
            - **100% Offline-First:** SQLite database stored purely locally on your device.
            - **Zero Registrations & Zero Tracking:** Complete privacy without external telemetry.
            - **Universal Android Compatibility:** Targets Android 7.0+ (API 24+) devices.
            - **Financial OS UI:** Premium dark-first glassmorphism design system.
            - **Accurate IDR Currency Calculations:** Integer-based Indonesian Rupiah math.
            - **Visual Analytics:** Donut charts, weekly spending trends, and budget health alerts.
            - **Savings Goal Engine:** Target tracking with dynamic daily/weekly/monthly savings calculators.
            - **Data Portability:** Full JSON backup and CSV transaction export/import.
            
            ### 📱 Installation
            Download and install `simply-cashflow.apk` directly on any modern Android smartphone.
          files: dist/simply-cashflow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
