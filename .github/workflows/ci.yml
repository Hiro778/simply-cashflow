name: CI & Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test -- --coverage

  build-android-apk:
    name: Build Standalone Android APK
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Package Dist Artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/simply-cashflow-2.0.0.apk
            cp "$APK_PATH" dist/simply-cashflow.apk
            echo "APK packaged successfully: $(ls -lh dist/)"
          else
            echo "Error: Release APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simply-cashflow-2.0.0-apk
          path: dist/simply-cashflow-2.0.0.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: Simply Cashflow ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          body: |
            # Simply Cashflow 2.0.0 — 100% Local Financial Operating System for Android

            ### 🚀 Highlights in 2.0.0
            - **Smart Capture:** Fully local Android Notification Listener for DANA, GoPay, OVO, ShopeePay, BCA, BRImo, and Livin' by Mandiri.
            - **Safe to Spend & Smart Budget Pace:** Transparent liquidity math and calendar velocity metrics.
            - **Savings Planner 2.0 & Recurring Engine:** Milestones, next due dates, and auto-advancement.
            - **Apple Design & Material Ergonomics:** Dark/Light dual themes, tabular numerals, fluid bottom sheets.
            - **100% Offline-First Privacy:** Zero cloud, zero analytics, zero external API dependencies.
          files: |
            dist/simply-cashflow-2.0.0.apk
            dist/simply-cashflow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
